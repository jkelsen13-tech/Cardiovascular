name: Lead placement lab verification
on:
  push:
    paths: ['lead-placement/**','tools/lead-placement/**','ecg-study/content.js','ecg-study/module.js','ecg-study/module.css','tools/ecg-study/verify.cjs','index.html','cmt-quiz.html','README.md','.github/workflows/lead-placement-validation.yml']
  pull_request:
    paths: ['lead-placement/**','tools/lead-placement/**','ecg-study/content.js','ecg-study/module.js','ecg-study/module.css','tools/ecg-study/verify.cjs','index.html','cmt-quiz.html','README.md','.github/workflows/lead-placement-validation.yml']
concurrency:
  group: lead-placement-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install hosted-runner verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - run: node tools/lead-placement/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lead-placement-review
          path: review-lead-placement/
