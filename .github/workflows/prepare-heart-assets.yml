name: Prepare offline heart assets
on:
  push:
    branches: ['codex/ecg-anatomical-heart-3d']
    paths: ['tools/ecg-study/build-heart-assets.cjs', 'tools/ecg-study/three-entry.js', '.github/workflows/prepare-heart-assets.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false three@0.180.0 esbuild@0.25.10
      - run: node tools/ecg-study/build-heart-assets.cjs
      - name: Commit inspected offline assets to the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecg-study/assets ecg-study/vendor
          git diff --cached --quiet && exit 0
          git commit -m "Vendor verified HRA heart models and offline Three.js runtime"
          git push origin HEAD:codex/ecg-anatomical-heart-3d
