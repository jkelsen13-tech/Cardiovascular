name: ASPT exam verification
on:
  push:
    branches: [aspt-exam-20260911]
  pull_request:
    paths: ['aspt/**', 'tools/aspt/**', '.github/workflows/aspt-validation.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools on hosted runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify ASPT coverage and teaching flow
        run: node tools/aspt/verify.cjs
      - name: Verify existing study questions
        run: node tools/study/verify.cjs
      - name: Verify source ECG trainer
        run: node tools/ecg/verify.cjs
