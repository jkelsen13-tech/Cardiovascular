name: ECG waves study verification
on:
  push:
    paths: ['ecg-study/**','tools/ecg-study/**','index.html','cmt-quiz.html','.github/workflows/ecg-study-validation.yml']
  pull_request:
    paths: ['ecg-study/**','tools/ecg-study/**','index.html','cmt-quiz.html','.github/workflows/ecg-study-validation.yml']
concurrency:
  group: heart-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install hosted-runner verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - run: node tools/ecg-study/verify.cjs
      - name: Verify anatomical heart on website transport
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/ecg-heart-http.log" 2>&1 &
          CARDIO_BASE_URL=http://127.0.0.1:8765/ node tools/ecg-study/verify-heart.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomical-heart-review
          path: review-heart/
