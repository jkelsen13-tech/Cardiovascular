name: ECG waves study verification
on:
  push:
    paths: ['ecg-study/**','tools/ecg-study/**','index.html','cmt-quiz.html','.github/workflows/ecg-study-validation.yml']
  pull_request:
    paths: ['ecg-study/**','tools/ecg-study/**','index.html','cmt-quiz.html','.github/workflows/ecg-study-validation.yml']
concurrency:
  group: heart-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install hosted-runner verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - run: node tools/ecg-study/verify.cjs
      - run: node tools/ecg-study/verify-heart.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomical-heart-review
          path: review-heart/
      - name: Temporary remote visual-review snapshots
        if: success() && github.ref == 'refs/heads/codex/ecg-anatomical-heart-3d'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-heart
          git diff --cached --quiet && exit 0
          git commit -m "Record temporary anatomical heart review screenshots"
          git push origin HEAD:codex/ecg-anatomical-heart-3d
